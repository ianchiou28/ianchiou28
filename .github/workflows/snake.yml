name: Generate Snake

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-2025.svg?color_snake=#5d3fd3&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39&since=2025-01-01&until=2025-12-31
            dist/github-contribution-grid-snake-dark-2025.svg?palette=github-dark&color_snake=#5d3fd3&since=2025-01-01&until=2025-12-31
            dist/github-contribution-grid-snake-2026.svg?color_snake=#5d3fd3&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39&since=2026-01-01&until=2026-12-31
            dist/github-contribution-grid-snake-dark-2026.svg?palette=github-dark&color_snake=#5d3fd3&since=2026-01-01&until=2026-12-31
          
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
